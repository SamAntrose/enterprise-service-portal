server:
  port: 8081
  servlet:
    context-path: /

spring:
  application:
    name: enterprise-service-portal

  profiles:
    active: h2 # Options: h2, postgresql

  # JPA & Hibernate Configuration
  jpa:
    show-sql: true
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

  # Static Resource Handling (Serves HTML, CSS, JS from /src/main/webapp)
  web:
    resources:
      static-locations: classpath:/META-INF/resources/,classpath:/resources/,classpath:/static/,classpath:/public/,file:src/main/webapp/

---
# H2 In-Memory Database Profile (Zero-config instant startup)
spring:
  config:
    activate:
      on-profile: h2

  datasource:
    url: jdbc:h2:mem:portaldb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: 
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update

---
# PostgreSQL Configuration Profile
spring:
  config:
    activate:
      on-profile: postgresql

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:enterprise_portal_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update

# JWT Security Configuration
app:
  jwt:
    secret: 9a6f8b2c4e1d3f5a7b9c0d2e4f6a8b1c3d5e7f9a2b4c6d8e0f1a3b5c7d9e1f3a
    expiration-ms: 86400000

logging:
  level:
    root: INFO
    com.enterprise.portal: DEBUG
